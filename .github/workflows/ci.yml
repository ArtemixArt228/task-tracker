name: CI
on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: password, POSTGRES_DB: task-tracker }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/task-tracker
      CORS_ORIGIN: http://localhost:3001
      VITE_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - uses: oven-sh/setup-bun@v2 # server runs and tests on Bun
      - run: pnpm install --frozen-lockfile
      - run: pnpm check # oxlint + oxfmt
      - run: pnpm check-types # tsc across all packages (turbo)
      - run: pnpm db:migrate # migrations from zero on a clean database
      - run: pnpm test # bun test in apps/server
      - run: pnpm build # web + server (turbo)

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f apps/server/Dockerfile -t server:ci .
      - run: docker build -f apps/web/Dockerfile --build-arg VITE_SERVER_URL=https://example.invalid -t web:ci .
